# Native std float math is not bit-identical to the wasm build (see AGENTS.md).
# All float math goes through the pinned libm crate. mul_add is banned because
# a fused multiply-add rounds once where separate operations round twice.
# min and max are banned because Rust does not fix which zero they return for
# +0.0 and -0.0, and the state hash reads bits. clamp stays allowed: it is two
# plain comparisons, so both targets give the same bits.
disallowed-methods = [
    { path = "f32::min", reason = "the sign of a zero result is not fixed; compare with < or > instead" },
    { path = "f32::max", reason = "the sign of a zero result is not fixed; compare with < or > instead" },
    { path = "f64::min", reason = "the sign of a zero result is not fixed; compare with < or > instead" },
    { path = "f64::max", reason = "the sign of a zero result is not fixed; compare with < or > instead" },
    { path = "f32::sin", reason = "std float math differs between native and wasm; use libm" },
