<!doctype html>
<html lang="en" data-theme="light" data-sim="dock">
<head>
<meta charset="utf-8">
<title>SpaceBench flight sheet</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../css/brand.css">
<link rel="stylesheet" href="templates.css">
<script src="../js/sb-logo.js"></script>
<script src="../js/sb-graphics.js"></script>
<script src="template.js"></script>
</head>
<body class="sb t t-flight">
<!-- 1200 x 1500. Variants: ?seed=421&tier=3&theme=light|dark. Replace specimenFlight with a real replay. -->
<div class="sb-meta sb-meta--rule"><span>SpaceBench Dock</span><span>Flight sheet</span><span id="page"></span><span id="ref"></span></div>
<div class="title"><span class="n" id="tn"></span><h1 id="h"></h1><div class="result"><span class="sb-status" id="st"></span><b id="res"></b></div></div>
<div class="sb-frame figure"><div class="sb-meta"><span class="sb-bracket">Approach chart</span><span>Side view · Log range</span></div><div id="chart"></div></div>
<div class="stats" id="stats"></div>
<table class="sb-spec" id="contact"></table>
<div class="grow"></div>
<div class="foot">
  <div id="sig"></div>
  <div class="row"><div class="sb-strip"><div class="sb-strip__mark"><span data-sb-logo="mark" data-follow-sim></span></div><div class="sb-strip__text"><span id="s1"></span><small>Re-simulated from the action log</small></div></div><span class="sb-specimen">Specimen. Generated for layout. Not a result</span></div>
</div>
<script>
(function () {
  var P = SBParams, G = SBGraphics, seed = P.num('seed', 421), tier = P.num('tier', 3), F = G.specimenFlight(seed, tier), $ = function (i) { return document.getElementById(i); };
  var id = 'SBD-T' + tier + '-' + P.pad4(seed);
  $('page').textContent = 'Tier ' + tier + ' · Seed ' + P.pad4(seed); $('ref').textContent = 'Ref. ' + id;
  $('tn').textContent = 'T' + tier + '/';
  $('h').innerHTML = 'Seed ' + P.pad4(seed) + '. <span class="sb-tone">' + G.TIERS[tier - 1].name + ', telemetry track.</span>';
  $('st').setAttribute('data-state', F.pass ? 'pass' : 'fail'); $('st').textContent = F.pass ? 'Contact inside every limit' : 'Limit exceeded at contact';
  $('res').textContent = F.pass ? 'PASS' : 'FAIL';
  $('chart').innerHTML = G.approachChart(F, { width: 1030, height: 330 });
  $('stats').innerHTML = [['Elapsed', P.clock(F.duration)], ['Pulses', F.pulses.length], ['Burn time', F.burn.toFixed(2) + ' S'], ['Holds reached', '3 OF 3']].map(function (s) {
    return '<div><span class="cap">' + s[0] + '</span><b>' + s[1] + '</b></div>';
  }).join('');
  $('contact').innerHTML = '<thead><tr><th>At first contact</th><th class="num">Measured</th><th class="num">Limit</th><th class="num">Status</th></tr></thead>' + G.LIMITS.map(function (l) {
    var v = F.contact[l.key], ok = v <= l.max && (l.min == null || v >= l.min);
    return '<tr><th style="font-weight:500">' + l.label + '</th><td class="num">' + v.toFixed(l.max >= 1 ? 1 : 3) + ' ' + l.unit + '</td><td class="num" style="color:var(--sb-fg-2)">' + l.text + '</td><td class="st"><span class="sb-status" data-state="' + (ok ? 'pass' : 'fail') + '">' + (ok ? 'In' : 'Out') + '</span></td></tr>';
  }).join('');
  $('sig').innerHTML = G.flightSignature(F, { width: 1088, height: 104 });
  $('s1').textContent = 'SpaceBench Dock · Tier ' + tier + ' · Seed ' + P.pad4(seed);
  P.done();
})();
</script>
</body>
</html>
