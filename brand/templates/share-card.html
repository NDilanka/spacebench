<!doctype html>
<html lang="en" data-theme="dark" data-sim="parent">
<head>
<meta charset="utf-8">
<title>SpaceBench share card</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../css/brand.css">
<link rel="stylesheet" href="templates.css">
<script src="../js/sb-logo.js"></script>
<script src="template.js"></script>
</head>
<body class="sb t t-plume t-og">
<!-- 1200 x 630. Variants: ?sim=parent|dock|landing&theme=light|dark. An identity piece: it sits on the plume field and carries no data. -->
<img class="ground" id="ground" alt="">
<div class="plate" id="art"></div>
<div class="txt">
  <span data-sb-logo="wordmark" data-follow-sim></span>
  <h1 id="h"></h1>
  <p id="p"></p>
</div>
<div class="meta" id="m"></div>
<script>
(function () {
  var P = SBParams, dark = P.theme === 'dark', $ = function (i) { return document.getElementById(i); };
  var V = {
    parent: { h: 'Models fly.<br>Physics scores.', p: 'A benchmark family for closed-loop spacecraft control by language models.', m: 'Benchmark family' },
    dock: { h: 'Six axes.<br>One attempt.', p: 'Dock a capsule to a station by hand, through thruster pulses and coasts. Scored at first contact.', m: 'Simulation 01 · In build' },
    landing: { h: 'The pad<br>is next.', p: 'Booster landing is the second simulation under the same harness.', m: 'Simulation 02 · In design' }
  }[P.sim];
  $('ground').src = '../textures/plume-sheet-' + (dark ? 'ink' : 'film') + '.jpg';
  $('art').innerHTML = SBPlate(P.sim, { dark: dark, size: 336, bare: true, base: '../textures/plume-square' });
  $('h').innerHTML = V.h; $('p').textContent = V.p; $('m').textContent = V.m;
  P.done();
})();
</script>
</body>
</html>
